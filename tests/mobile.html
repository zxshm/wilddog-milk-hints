<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>手机宽度预览检查</title>
<style>
  body { margin: 16px; background: #eee; font-family: "Microsoft YaHei", sans-serif; }
  main { display: flex; gap: 24px; align-items: flex-start; }
  iframe { border: 0; display: block; background: #fff8ec; box-shadow: 0 0 0 1px #bbb; }
  #phone { width: 322.5px; height: 635.25px; }
  #preview { transform: scale(.75); transform-origin: top left; }
  h2 { margin: 0 0 8px; font-size: 16px; }
  aside { max-width: 500px; }
  button, select { padding: 10px; margin: 0 8px 10px 0; }
  pre { font-size: 12px; white-space: pre-wrap; }
</style>
<main>
  <section><h2 id="size">430 × 847 · 微信可用窗口模拟</h2><div id="phone"><iframe id="preview" src="/" width="430" height="847" title="手机游戏预览"></iframe></div></section>
  <aside>
    <h2>手机布局验收</h2>
    <p>仅模拟网页视口尺寸，不等同于真实手机微信测试。</p>
    <label for="preset">窗口尺寸</label>
    <select id="preset">
      <option value="430,847">430 × 847</option><option value="390,844">390 × 844</option>
      <option value="393,720">393 × 720</option><option value="360,640">360 × 640</option>
      <option value="320,568">320 × 568</option><option value="844,390">844 × 390 横屏</option>
      <option value="1200,900">1200 × 900 桌面</option>
    </select>
    <button id="measure">读取布局</button>
    <p id="summary"></p>
    <button id="safeArea">模拟底部安全区 34 像素</button>
    <button id="legacy">旧微信接口兼容测试</button>
    <p id="compatibility"></p>
    <details><summary>完整布局数据</summary>
    <pre id="metrics">等候游戏加载…</pre>
    </details>
  </aside>
</main>
<script>
// 将被测页面的可见布局写入测试面板，浏览器验收只需读取面板。
const frame = document.getElementById('preview');
function measure() {
  const d = frame.contentDocument;
  if (!d || !d.getElementById('board')) return;
  const rect = id => {
    const r = d.getElementById(id).getBoundingClientRect();
    return { x: r.x, y: r.y, width: r.width, height: r.height, bottom: r.bottom };
  };
  const ids = ['top', 'board', 'chain', 'hintDock', 'hintToggle', 'hintPlace', 'hintMode', 'hintRefresh', 'soundBtn', 'resetBtn', 'rankButton'];
  const record = {
    viewport: [frame.clientWidth, frame.clientHeight],
    layout: Object.fromEntries(ids.map(id => [id, rect(id)])),
    scrollSize: [d.documentElement.scrollWidth, d.documentElement.scrollHeight],
    bodyScrollSize: [d.body.scrollWidth, d.body.scrollHeight],
    score: d.getElementById('score').textContent,
    hintReady: !d.getElementById('hintPlace').disabled,
    legacyTimeoutMissing: typeof frame.contentWindow.AbortSignal?.timeout !== 'function',
    rankingStatus: d.getElementById('rankStatus')?.textContent || '',
    rankingText: d.getElementById('rankList')?.textContent || '',
  };
  document.getElementById('metrics').textContent = JSON.stringify(record, null, 2);
  document.getElementById('summary').textContent = `棋盘 ${record.layout.board.width} × ${record.layout.board.height}；提示按钮高度 ${record.layout.hintPlace.height}；本局 ${record.score} 分。`;
}
document.getElementById('preset').onchange = event => {
  const [width, height] = event.target.value.split(',').map(Number);
  frame.width = width; frame.height = height;
  document.getElementById('phone').style.width = width * .75 + 'px';
  document.getElementById('phone').style.height = height * .75 + 'px';
  document.getElementById('size').textContent = `${width} × ${height} · 可用窗口模拟`;
};
document.getElementById('measure').onclick = measure;
document.getElementById('legacy').onclick = () => {
  frame.src = '/__qa/ranking-compat';
  document.getElementById('compatibility').textContent = '已停用新超时接口。点奖杯读取正式共享榜单；这里只读，不添加测试成绩。';
};
document.getElementById('safeArea').onclick = () => {
  frame.contentDocument.body.style.paddingBottom = '34px';
  frame.contentWindow.dispatchEvent(new Event('resize'));
  measure();
};
frame.onload = measure;
setInterval(measure, 1000);
</script>
</html>
